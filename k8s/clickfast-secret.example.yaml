# Modèle : copier en clickfast-secret.yaml (ignoré par Git), remplacer les valeurs, puis
#   kubectl apply -f k8s/clickfast-secret.yaml
# Le Secret n'est que du base64 : jamais de vraie valeur dans le dépôt.
apiVersion: v1
kind: Secret
metadata:
  name: clickfast-secret
  namespace: clickfast
type: Opaque
stringData:
  DB_USER: clickfast
  DB_PASSWORD: change-moi
  DB_NAME: clickfast
