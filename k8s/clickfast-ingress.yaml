apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clickfast-ingress
  namespace: clickfast
spec:
  ingressClassName: traefik
  rules:
    - host: clickfast.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clickfast-api
                port:
                  number: 80
