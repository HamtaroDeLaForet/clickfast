apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickfast-api
  namespace: clickfast
spec:
  replicas: 3
  # Zéro requête perdue : un pod en plus pendant la mise à jour, jamais un en moins
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: clickfast-api
  template:
    metadata:
      labels:
        app: clickfast-api
    spec:
      containers:
        - name: api
          # Tag fixé par kustomization.yaml (sha du commit), jamais latest
          image: ghcr.io/hamtarodelaforet/clickfast-api
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: clickfast-config
            - secretRef:
                name: clickfast-secret
          # Mesuré sous charge.sh : ~26Mi et ~10m CPU par pod
          resources:
            requests: { cpu: 50m, memory: 16Mi }
            limits: { cpu: 250m, memory: 24Mi }
          # Laisse 5 s à Traefik pour retirer le pod de ses cibles avant le SIGTERM : sinon 502 pendant le rollout
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          # Pas prêt : retiré du Service, aucune requête ne lui est envoyée
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 2
            periodSeconds: 3
          # Bloqué : redémarré. Délai plus large pour ne jamais tuer un pod qui démarre.
          # Limite : /health ne teste pas la base, un pod sans base reste 1/1 et renvoie des 500/503
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
