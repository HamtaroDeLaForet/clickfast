name: Release

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/hamtarodelaforet/clickfast
  API_IMAGE: ghcr.io/hamtarodelaforet/clickfast-api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test

  api-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # Base jetable, recréée à chaque run ; le job attend qu'elle soit prête (pg_isready)
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DB_HOST: localhost
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  security-deps:
    runs-on: ubuntu-latest
    outputs:
      high: ${{ steps.audit.outputs.high }}
      critical: ${{ steps.audit.outputs.critical }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: audit
        run: |
          npm audit --json > audit.json || true
          echo "high=$(jq '.metadata.vulnerabilities.high' audit.json)" >> "$GITHUB_OUTPUT"
          echo "critical=$(jq '.metadata.vulnerabilities.critical' audit.json)" >> "$GITHUB_OUTPUT"
      # Bloque sur high et critical, laisse passer le reste
      - run: npm audit --audit-level=high

  security-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tout l'historique, pas seulement le dernier commit
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Un humain doit cliquer "approve" avant que le job démarre
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  api-build:
    needs: [api-test, api-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}

  deploy:
    needs: api-build
    # Double sécurité : le workflow ne tourne déjà que sur main
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Déploie sur vm-prod et vérifie /health
        run: |
          set -euo pipefail
          # Secret absent ou mal nommé : message clair, sans jamais afficher de valeur
          for name in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_PORT DEPLOY_USER; do
            [ -n "${!name}" ] || { echo "::error::secret $name vide ou introuvable"; exit 1; }
          done

          # La clé ne touche jamais le disque : elle vit dans un agent SSH détruit en fin de step
          eval "$(ssh-agent -s)" > /dev/null
          trap 'ssh-agent -k > /dev/null' EXIT
          ssh-add - <<< "$DEPLOY_SSH_KEY" 2> /dev/null || { echo "::error::DEPLOY_SSH_KEY n'est pas une clé privée valide"; exit 1; }

          TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)
          ssh "${OPTS[@]}" -p "$DEPLOY_PORT" "$TARGET" 'mkdir -p /srv/clickfast'
          scp "${OPTS[@]}" -P "$DEPLOY_PORT" -r deploy/compose.yml deploy/prometheus.yml deploy/grafana "$TARGET:/srv/clickfast/"

          # Jeton valable le temps du job, passé par stdin : jamais dans la ligne de commande ni le log
          printf '%s' "$GHCR_TOKEN" | ssh "${OPTS[@]}" -p "$DEPLOY_PORT" "$TARGET" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin > /dev/null"
          # pull d'abord : un tag introuvable échoue ici, avant d'arrêter quoi que ce soit
          ssh "${OPTS[@]}" -p "$DEPLOY_PORT" "$TARGET" \
            "cd /srv/clickfast && export TAG=$GITHUB_SHA && docker compose pull scores-api && docker compose up -d --remove-orphans"

          for _ in $(seq 1 30); do
            if ssh "${OPTS[@]}" -p "$DEPLOY_PORT" "$TARGET" 'wget -qO- localhost:3000/health'; then
              echo; echo "Déployé : ${GITHUB_SHA::7}"; exit 0
            fi
            sleep 2
          done
          echo "::error::/health ne répond pas 60 s après le déploiement de ${GITHUB_SHA::7}"
          exit 1

  security-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      vulns: ${{ steps.count.outputs.vulns }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: json
          output: trivy.json
          exit-code: 0
      # Même seuil que npm audit : on bloque sur HIGH et CRITICAL
      - id: count
        run: |
          n=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          echo "vulns=$n" >> "$GITHUB_OUTPUT"
          jq -r '.Results[]?.Vulnerabilities[]? | "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion)"' trivy.json
          test "$n" -eq 0

  sbom:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      components: ${{ steps.count.outputs.components }}
    steps:
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      # Un SBOM vide signale qu'il a tourné avant que l'image ne soit poussée
      - id: count
        run: |
          n=$(jq '.components | length' sbom.cdx.json)
          echo "components=$n" >> "$GITHUB_OUTPUT"
          test "$n" -gt 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json

  security-summary:
    needs: [security-deps, security-secrets, security-image, sbom]
    # Tourne même si un scan a échoué ou a été sauté
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          DEPS: ${{ needs.security-deps.result }}
          HIGH: ${{ needs.security-deps.outputs.high }}
          CRITICAL: ${{ needs.security-deps.outputs.critical }}
          SECRETS: ${{ needs.security-secrets.result }}
          IMAGE_RESULT: ${{ needs.security-image.result }}
          VULNS: ${{ needs.security-image.outputs.vulns }}
          SBOM: ${{ needs.sbom.result }}
          COMPONENTS: ${{ needs.sbom.outputs.components }}
        run: |
          # Valeur absente (job sauté ou planté avant d'écrire) : on l'affiche comme telle, jamais inventée
          val() { [ -n "$1" ] && echo "$1" || echo "n/a"; }
          icon() { case "$1" in success) echo "✅";; ""|skipped) echo "⏭️ sauté";; *) echo "❌ $1";; esac; }
          {
            echo "## Sécurité de \`${GITHUB_SHA::7}\`"
            echo
            echo "| Contrôle | Statut | Détail |"
            echo "|---|---|---|"
            echo "| Dépendances (npm audit) | $(icon "$DEPS") | high: $(val "$HIGH"), critical: $(val "$CRITICAL") |"
            echo "| Secrets (gitleaks) | $(icon "$SECRETS") | historique complet |"
            echo "| Image (Trivy) | $(icon "$IMAGE_RESULT") | HIGH/CRITICAL: $(val "$VULNS") |"
            echo "| Inventaire (SBOM Syft) | $(icon "$SBOM") | composants: $(val "$COMPONENTS") |"
            echo
            if [ "$DEPS" = success ] && [ "$SECRETS" = success ] && [ "$IMAGE_RESULT" = success ] && [ "$SBOM" = success ]; then
              echo "**Publiable en confiance : oui**"
            else
              echo "**Publiable en confiance : non**, voir les lignes non vertes"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
