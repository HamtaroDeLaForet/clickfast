name: CI

on:
  push:
  pull_request:

env:
  IMAGE: ghcr.io/hamtarodelaforet/clickfast
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  security-deps:
    runs-on: ubuntu-latest
    outputs:
      high: ${{ steps.audit.outputs.high }}
      critical: ${{ steps.audit.outputs.critical }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: audit
        run: |
          npm audit --json > audit.json || true
          echo "high=$(jq '.metadata.vulnerabilities.high' audit.json)" >> "$GITHUB_OUTPUT"
          echo "critical=$(jq '.metadata.vulnerabilities.critical' audit.json)" >> "$GITHUB_OUTPUT"
      # Bloque sur high et critical, laisse passer le reste
      - run: npm audit --audit-level=high

  security-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tout l'historique, pas seulement le dernier commit
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Sur une pull request : build seulement, on ne publie jamais du travail en chantier
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  security-image:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      vulns: ${{ steps.count.outputs.vulns }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: json
          output: trivy.json
          exit-code: 0
      # Même seuil que npm audit : on bloque sur HIGH et CRITICAL
      - id: count
        run: |
          n=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          echo "vulns=$n" >> "$GITHUB_OUTPUT"
          jq -r '.Results[]?.Vulnerabilities[]? | "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion)"' trivy.json
          test "$n" -eq 0

  sbom:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      components: ${{ steps.count.outputs.components }}
    steps:
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      # Un SBOM vide signale qu'il a tourné avant que l'image ne soit poussée
      - id: count
        run: |
          n=$(jq '.components | length' sbom.cdx.json)
          echo "components=$n" >> "$GITHUB_OUTPUT"
          test "$n" -gt 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json

  security-summary:
    needs: [security-deps, security-secrets, security-image, sbom]
    # Tourne même si un scan a échoué ou a été sauté
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          DEPS: ${{ needs.security-deps.result }}
          HIGH: ${{ needs.security-deps.outputs.high }}
          CRITICAL: ${{ needs.security-deps.outputs.critical }}
          SECRETS: ${{ needs.security-secrets.result }}
          IMAGE_RESULT: ${{ needs.security-image.result }}
          VULNS: ${{ needs.security-image.outputs.vulns }}
          SBOM: ${{ needs.sbom.result }}
          COMPONENTS: ${{ needs.sbom.outputs.components }}
        run: |
          # Valeur absente (job sauté ou planté avant d'écrire) : on l'affiche comme telle, jamais inventée
          val() { [ -n "$1" ] && echo "$1" || echo "n/a"; }
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️ sauté";; *) echo "❌ $1";; esac; }
          {
            echo "## Sécurité de \`${GITHUB_SHA::7}\`"
            echo
            echo "| Contrôle | Statut | Détail |"
            echo "|---|---|---|"
            echo "| Dépendances (npm audit) | $(icon "$DEPS") | high: $(val "$HIGH"), critical: $(val "$CRITICAL") |"
            echo "| Secrets (gitleaks) | $(icon "$SECRETS") | historique complet |"
            echo "| Image (Trivy) | $(icon "$IMAGE_RESULT") | HIGH/CRITICAL: $(val "$VULNS") |"
            echo "| Inventaire (SBOM Syft) | $(icon "$SBOM") | composants: $(val "$COMPONENTS") |"
            echo
            if [ "$DEPS" = success ] && [ "$SECRETS" = success ] && [ "$IMAGE_RESULT" = success ] && [ "$SBOM" = success ]; then
              echo "**Publiable en confiance : oui**"
            else
              echo "**Publiable en confiance : non**, voir les lignes non vertes"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
