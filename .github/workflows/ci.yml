name: CI

on:
  push:
  pull_request:

env:
  IMAGE: ghcr.io/hamtarodelaforet/clickfast
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  security-deps:
    runs-on: ubuntu-latest
    outputs:
      high: ${{ steps.audit.outputs.high }}
      critical: ${{ steps.audit.outputs.critical }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: audit
        run: |
          npm audit --json > audit.json || true
          echo "high=$(jq '.metadata.vulnerabilities.high' audit.json)" >> "$GITHUB_OUTPUT"
          echo "critical=$(jq '.metadata.vulnerabilities.critical' audit.json)" >> "$GITHUB_OUTPUT"
      # Bloque sur high et critical, laisse passer le reste
      - run: npm audit --audit-level=high

  security-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tout l'historique, pas seulement le dernier commit
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Sur une pull request : build seulement, on ne publie jamais du travail en chantier
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  security-image:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      vulns: ${{ steps.count.outputs.vulns }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: json
          output: trivy.json
          exit-code: 0
      # Même seuil que npm audit : on bloque sur HIGH et CRITICAL
      - id: count
        run: |
          n=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          echo "vulns=$n" >> "$GITHUB_OUTPUT"
          jq -r '.Results[]?.Vulnerabilities[]? | "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion)"' trivy.json
          test "$n" -eq 0
